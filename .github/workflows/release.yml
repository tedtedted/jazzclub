name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        type: string
      macos:
        description: Also build the macOS package (billed at 10x on private repositories)
        type: boolean
        default: true

# read-only by default; only the publish job may write, and only to create the release
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '25.0.2'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # docs/release.md: releases ship from main. A tag is cheap to put on the wrong commit.
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: The tagged commit must be on main
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      - id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer release version: $version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    name: Tests and coverage
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp -Drevision=${{ needs.version.outputs.version }} verify

  package:
    name: Package (${{ matrix.package }})
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 on purpose: a binary only starts on a glibc at least as new as the one it
          # was linked against. 24.04 has 2.39, Debian 12 has 2.36; 22.04's 2.35 runs on both.
          - package: deb-amd64
            runner: ubuntu-22.04
            os: linux
            deb_arch: amd64
            arch_arch: x86_64
          - package: deb-arm64
            runner: ubuntu-22.04-arm
            os: linux
            deb_arch: arm64
            arch_arch: aarch64
          - package: macos
            runner: macos-latest
            os: macos
    steps:
      # GitHub cannot leave out single matrix entries up front, so a rehearsal without macOS bows out here
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos" && "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.macos }}" == "false" ]]; then
            echo "Skipping the macOS package in this rehearsal."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.build == 'true'

      - uses: graalvm/setup-graalvm@v1
        if: steps.gate.outputs.build == 'true'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          cache: maven

      - name: Install packaging tools
        if: steps.gate.outputs.build == 'true' && matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build native binary
        if: steps.gate.outputs.build == 'true'
        run: ./mvnw -B -ntp -Pnative -DskipTests -Drevision=${{ needs.version.outputs.version }} native:compile

      # shared with ci.yml; also checks exit codes, the size budget and, on Linux, the glibc needed
      - name: Smoke test binary
        if: steps.gate.outputs.build == 'true'
        run: scripts/smoke-test.sh target/jazzclub "${{ needs.version.outputs.version }}"

      - name: Build Linux packages
        if: matrix.os == 'linux'
        shell: bash
        run: |
          scripts/package-deb.sh "${{ needs.version.outputs.version }}" "${{ matrix.deb_arch }}" target/jazzclub dist
          scripts/package-arch.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch_arch }}" target/jazzclub dist
          # what packaging/arch/PKGBUILD.in installs from, and a download for every other distribution
          scripts/package-linux.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch_arch }}" target/jazzclub dist

      - name: Build macOS package
        if: steps.gate.outputs.build == 'true' && matrix.os == 'macos'
        shell: bash
        run: scripts/package-macos.sh "${{ needs.version.outputs.version }}" "$(uname -m)" target/jazzclub dist

      - name: Checksums
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS-${{ matrix.package }}

      - name: Upload package artifacts
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  pkgbuild:
    name: Arch PKGBUILD
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-deb-*
          merge-multiple: true

      - name: Render PKGBUILD
        run: |
          mkdir -p aur
          scripts/render-pkgbuild.sh "${{ needs.version.outputs.version }}" dist > aur/PKGBUILD
          cp dist/jazzclub-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz aur/
          cat aur/PKGBUILD

      # The real thing: makepkg, namcap and an installation on Arch Linux. makepkg finds the tarball next
      # to the PKGBUILD and checks it against the pinned checksum instead of downloading it.
      - name: Build, lint and install on Arch Linux
        run: |
          docker run --rm -v "$PWD/aur:/aur" -v "$PWD/scripts:/scripts:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel namcap > /dev/null
            echo "== the dependencies named in the PKGBUILD exist in the repositories"
            pacman -Si ffmpeg alsa-lib glibc zlib pipewire-alsa pulseaudio-alsa | grep -E "^Name"
            useradd -m builder
            chown -R builder /aur
            cd /aur
            echo "== makepkg"
            su builder -c "makepkg --nodeps --noconfirm"
            su builder -c "makepkg --printsrcinfo" > .SRCINFO
            echo "== namcap"
            namcap PKGBUILD
            namcap jazzclub-bin-*.pkg.tar.zst | tee namcap.txt
            # not "! grep": a command negated with ! is exempt from set -e and could never fail the job
            if grep -E " E: " namcap.txt; then echo "namcap reports errors" >&2; exit 1; fi
            echo "== contents"
            pacman -Qlp jazzclub-bin-*.pkg.tar.zst
            echo "== install and run"
            pacman -U --noconfirm --nodeps --nodeps jazzclub-bin-*.pkg.tar.zst
            /scripts/smoke-test.sh /usr/bin/jazzclub "${{ needs.version.outputs.version }}"
            pacman -Qi jazzclub-bin | grep -E "^(Name|Version|Depends On|Optional Deps|Provides|Conflicts)"
          '

      - name: Collect
        run: |
          mkdir -p out
          cp aur/PKGBUILD aur/.SRCINFO out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: packages-pkgbuild
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [version, package, pkgbuild]
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "jazzclub ${{ needs.version.outputs.version }}" \
            --generate-notes \
            "${prerelease_flag[@]}"
