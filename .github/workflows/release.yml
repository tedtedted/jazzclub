name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        type: string

# read-only by default; only the publish job may write, and only to create the release
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '25.0.2'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # docs/release.md: releases ship from main. A tag is cheap to put on the wrong commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tagged commit must be on main
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      - id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer release version: $version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # the release notes come from CHANGELOG.md; a missing section fails here, not after the builds
      - name: The changelog has notes for this version
        run: |
          scripts/changelog.sh check
          scripts/changelog.sh notes "${{ steps.version.outputs.version }}" > /dev/null

  test:
    name: Tests and coverage
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          cache: maven

      # DecoderConformanceTest runs every check against both decoders; without ffmpeg its ffmpeg
      # half would be skipped, so here a missing ffmpeg fails the build instead
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Verify
        run: ./mvnw -B -ntp -Drevision=${{ needs.version.outputs.version }} verify
        env:
          JAZZCLUB_REQUIRE_FFMPEG: 'true'

  package:
    name: Package (${{ matrix.package }})
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 on purpose: a binary only starts on a glibc at least as new as the one it
          # was linked against. 24.04 has 2.39, Debian 12 has 2.36; 22.04's 2.35 runs on both.
          - package: linux-x64
            runner: ubuntu-22.04
            os: linux
            deb_arch: amd64
            arch_arch: x86_64
          - package: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
            deb_arch: arm64
            arch_arch: aarch64
          - package: macos-arm64
            runner: macos-latest
            os: macos
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          cache: maven

      - name: Install packaging tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y zstd

      # jazzclub's own Last.fm API account, compiled in from .env (see .env.example). A release
      # that cannot scrobble would fail every user who sets lastfm_user, so a missing key stops it.
      - name: Provide the Last.fm API key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        shell: bash
        run: |
          if [[ -z "$LASTFM_API_KEY" || -z "$LASTFM_API_SECRET" ]]; then
            echo "::error::Repository secrets LASTFM_API_KEY and LASTFM_API_SECRET are required for a release"
            exit 1
          fi
          printf 'LASTFM_API_KEY=%s\nLASTFM_API_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > .env

      - name: Build native binary
        run: ./mvnw -B -ntp -Pnative -DskipTests -Drevision=${{ needs.version.outputs.version }} native:compile

      # shared with ci.yml; also checks exit codes, the size budget and, on Linux, the glibc needed
      - name: Smoke test binary
        run: scripts/smoke-test.sh target/jazzclub "${{ needs.version.outputs.version }}"

      - name: Build Linux packages
        if: matrix.os == 'linux'
        shell: bash
        run: |
          scripts/package-deb.sh "${{ needs.version.outputs.version }}" "${{ matrix.deb_arch }}" target/jazzclub dist
          scripts/package-arch.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch_arch }}" target/jazzclub dist
          # what packaging/arch/PKGBUILD.in installs from, and a download for every other distribution
          scripts/package-linux.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch_arch }}" target/jazzclub dist

      - name: Build macOS package
        if: matrix.os == 'macos'
        shell: bash
        run: scripts/package-macos.sh "${{ needs.version.outputs.version }}" "$(uname -m)" target/jazzclub dist

      # The formula the tap will get, proven here: installed with Homebrew from the archive just
      # built (a file:// URL, since the release does not exist yet), then brew test and brew style.
      - name: Test the Homebrew formula
        if: matrix.os == 'macos'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_FROM_API: '1'
        run: |
          version="${{ needs.version.outputs.version }}"
          tarball="$PWD/dist/jazzclub-${version}-macos-arm64.tar.gz"
          brew tap-new --no-git jazzclub-ci/test
          tap="$(brew --repository jazzclub-ci/test)"
          scripts/render-formula.sh "$version" "$tarball" "$tap/Formula/jazzclub.rb" "file://$tarball"
          brew style jazzclub-ci/test/jazzclub
          brew install --formula jazzclub-ci/test/jazzclub
          brew test jazzclub-ci/test/jazzclub
          scripts/smoke-test.sh "$(brew --prefix)/bin/jazzclub" "$version"
          test -f "$(brew --prefix jazzclub)/libexec/jazzclub/libconnector.dylib"

          mkdir -p formula
          scripts/render-formula.sh "$version" "$tarball" formula/jazzclub.rb

      - name: Upload Homebrew formula
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: formula/jazzclub.rb
          if-no-files-found: error
          retention-days: 30

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # The AUR's jazzclub-bin, proven before anything is published: rendered from the Linux tarballs just
  # built, then makepkg, namcap with no errors allowed, pacman -U and the smoke test in an Arch container
  pkgbuild:
    name: Arch PKGBUILD
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-linux-*
          merge-multiple: true

      - name: Render PKGBUILD
        run: |
          mkdir -p aur
          scripts/render-pkgbuild.sh "${{ needs.version.outputs.version }}" dist > aur/PKGBUILD
          # makepkg uses a source file it finds next to the PKGBUILD, checked against the pinned
          # checksum, instead of downloading it from a release that does not exist yet
          cp "dist/jazzclub-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" aur/
          cat aur/PKGBUILD

      - name: Build, lint and install on Arch Linux
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$PWD/aur:/aur" -v "$PWD/scripts:/scripts:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel namcap > /dev/null
            echo "== the packages named in the PKGBUILD exist"
            pacman -Si alsa-lib gcc-libs glibc zlib ffmpeg pipewire-alsa pulseaudio-alsa bash-completion | grep -E "^Name"
            useradd -m builder
            chown -R builder /aur
            cd /aur
            echo "== makepkg"
            su builder -c "makepkg --nodeps --noconfirm"
            su builder -c "makepkg --printsrcinfo" > .SRCINFO
            echo "== namcap"
            namcap PKGBUILD
            namcap jazzclub-bin-*.pkg.tar.zst | tee namcap.txt
            # not "! grep": a command negated with ! is exempt from set -e and could never fail the job
            if grep -E " E: " namcap.txt; then echo "namcap reports errors" >&2; exit 1; fi
            echo "== contents"
            pacman -Qlp jazzclub-bin-*.pkg.tar.zst
            echo "== install and run"
            pacman -U --noconfirm jazzclub-bin-*.pkg.tar.zst
            /scripts/smoke-test.sh /usr/bin/jazzclub "$VERSION"
            test -f /usr/lib/jazzclub/libconnector.so
            pacman -Qi jazzclub-bin | grep -E "^(Name|Version|Depends On|Optional Deps|Provides|Conflicts)"
          '

      - name: Collect
        run: |
          mkdir -p out
          cp aur/PKGBUILD aur/.SRCINFO out/
          cat out/.SRCINFO

      # not packages-*: these go to the AUR, not onto the release page
      - uses: actions/upload-artifact@v4
        with:
          name: aur-package
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # A rehearsal (workflow_dispatch) runs this too, so the notes and checksums are proven before a
  # tag; only the last step, which creates the release, is skipped.
  publish:
    name: Publish GitHub release
    needs: [version, package, pkgbuild]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      # one file for every package, so `sha256sum -c SHA256SUMS --ignore-missing` checks any download
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          {
            if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then
              echo "A pre-release of what comes next; expect rough edges."
              echo
            fi
            scripts/changelog.sh notes "$version"
            echo
            echo "---"
            echo
            echo "Install instructions are in the [README](https://github.com/${GITHUB_REPOSITORY}/blob/v${version}/README.md#install)."
            echo "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\` (on macOS \`shasum -a 256 -c SHA256SUMS --ignore-missing\`)."
          } > release-notes.md
          cat release-notes.md

      - name: Upload release contents
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.version }}
          path: |
            dist/*
            release-notes.md
          retention-days: 14

      # --repo: v0.1.0 never published because gh had no clone to read the repository from
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "jazzclub ${{ needs.version.outputs.version }}" \
            --notes-file release-notes.md \
            "${prerelease_flag[@]}"

  # Final releases only: the tap at github.com/tedtedted/homebrew-tap gets the formula tested above.
  # Pushes with a deploy key that can write to the tap and nothing else; docs/release.md has the setup.
  homebrew:
    name: Update Homebrew tap
    needs: [version, publish]
    if: github.event_name == 'push' && needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: The tap's deploy key is configured
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo "::error::Repository secret HOMEBREW_TAP_DEPLOY_KEY is missing; the release is out but the tap was not updated"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: tedtedted/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: formula

      - name: Commit and push the formula
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../formula/jazzclub.rb Formula/jazzclub.rb
          git add Formula/jazzclub.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "jazzclub ${{ needs.version.outputs.version }}"
          git push

  # Final releases only: the AUR's jazzclub-bin gets the PKGBUILD and .SRCINFO proven above. Pushes
  # with the SSH key of the AUR account that maintains the package; docs/release.md has the setup.
  aur:
    name: Update AUR package
    needs: [version, publish]
    if: github.event_name == 'push' && needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Repository secret AUR_SSH_PRIVATE_KEY is missing; the release is out but the AUR was not updated"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # pinned rather than scanned; matches the Ed25519 fingerprint on https://aur.archlinux.org
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - uses: actions/download-artifact@v4
        with:
          name: aur-package
          path: aur-package

      # The first push creates the package on the AUR; later ones add a commit per release.
      - name: Commit and push to the AUR
        run: |
          git clone ssh://aur@aur.archlinux.org/jazzclub-bin.git aur
          cp aur-package/PKGBUILD aur-package/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this PKGBUILD."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "jazzclub ${{ needs.version.outputs.version }}"
          git push origin HEAD:master
