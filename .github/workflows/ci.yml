name: CI

# Feature branches are tested through their pull request only, so a push to one no longer runs
# everything twice. Run documentation PRs too: README and changelog checks protect release inputs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS binary (billed at 10x on private repositories)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # keep in step with .sdkmanrc
  JAVA_VERSION: '25.0.2'

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          cache: maven

      # release notes come from CHANGELOG.md; a malformed one would only fail at release time
      - name: Check the changelog
        run: scripts/changelog.sh check

      # DecoderConformanceTest runs every check against both decoders; without ffmpeg its ffmpeg
      # half would be skipped, so here a missing ffmpeg fails the build instead
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      # fails below the JaCoCo line-coverage gate configured in pom.xml
      - name: Verify
        run: ./mvnw -B -ntp verify
        env:
          JAZZCLUB_REQUIRE_FFMPEG: 'true'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: Native binary (${{ matrix.name }})
    needs: test
    # pull requests get the tests only; a native build takes several minutes
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 on purpose: a binary only runs on a glibc at least as new as the one it
          # was linked against, and 22.04's 2.35 is older than Debian 12's 2.36.
          - name: linux-x64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: macos-arm64
            runner: macos-latest
    steps:
      # GitHub cannot skip single matrix entries up front, so macOS bows out here unless it is wanted
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          if [[ "${{ matrix.name }}" != macos-* || "${{ github.ref_type }}" == "tag" || "${{ inputs.macos }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping ${{ matrix.name }}: built for tags and manual runs only."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.build == 'true'

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        if: steps.gate.outputs.build == 'true'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          cache: maven

      # jazzclub's own Last.fm API account, compiled in from .env (see .env.example). Secrets never
      # reach builds of pull requests from forks; those binaries just cannot scrobble.
      - name: Provide the Last.fm API key
        if: steps.gate.outputs.build == 'true'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        shell: bash
        run: |
          if [[ -n "$LASTFM_API_KEY" && -n "$LASTFM_API_SECRET" ]]; then
            printf 'LASTFM_API_KEY=%s\nLASTFM_API_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > .env
          else
            echo "No Last.fm API key available; this binary will not scrobble."
          fi

      - name: Build
        if: steps.gate.outputs.build == 'true'
        run: ./mvnw -B -ntp -Pnative -DskipTests native:compile

      - name: Smoke test
        if: steps.gate.outputs.build == 'true'
        run: scripts/smoke-test.sh target/jazzclub

      - name: Test native audio
        if: steps.gate.outputs.build == 'true'
        run: |
          python3 scripts/smoke-test-audio.py target/jazzclub
          python3 scripts/smoke-test-audio.py target/jazzclub --signal

      - name: Upload binary
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jazzclub-${{ matrix.name }}
          path: target/jazzclub
          if-no-files-found: error
          retention-days: 30
