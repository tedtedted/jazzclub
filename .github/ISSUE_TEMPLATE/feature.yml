name: Feature request
description: Suggest a focused improvement to jazzclub.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include examples of the CLI, config or key interaction, if relevant.
    validations:
      required: true
