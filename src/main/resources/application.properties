spring.main.banner-mode=off
spring.main.web-application-type=none
# The terminal UI owns stdout; stay quiet unless -v is given
logging.level.root=WARN
# jazzclub's own Last.fm API account (https://www.last.fm/api/account/create). It identifies the
# application, not the user. Filled in by Maven from .env, see .env.example; blank without it, and
# Last.fm scrobbling is then unavailable.
jazzclub.lastfm.api-key=@LASTFM_API_KEY@
jazzclub.lastfm.api-secret=@LASTFM_API_SECRET@
